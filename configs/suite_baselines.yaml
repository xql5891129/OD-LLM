suite_name: baselines
base_config: configs/real_od_transformer.yaml

experiments:
  - name: baseline_last_value
    model:
      name: last_value
    train:
      epochs: 1
      amp: false

  - name: baseline_historical_average
    model:
      name: historical_average
    train:
      epochs: 1
      amp: false

  - name: baseline_gru
    model:
      name: gru_baseline
      d_model: 128
      num_layers: 2
      dim_feedforward: 256
    train:
      batch_size: 4
      epochs: 30
      amp: false

  - name: baseline_lstm
    model:
      name: lstm_baseline
      d_model: 128
      num_layers: 2
      dim_feedforward: 256
    train:
      batch_size: 4
      epochs: 30
      amp: false

  - name: baseline_tcn
    model:
      name: tcn_baseline
      d_model: 128
      num_layers: 3
      kernel_size: 3
      dim_feedforward: 256
    train:
      batch_size: 8
      epochs: 30
      amp: false

  - name: baseline_flatten_transformer
    model:
      name: transformer_flatten
      d_model: 128
      n_heads: 4
      num_layers: 2
      dim_feedforward: 256
    train:
      batch_size: 8
      epochs: 30
      amp: false

  - name: baseline_od_tensor_transformer
    model:
      name: od_tensor_transformer
      rank: 4
      d_model: 64
      n_heads: 4
      num_layers: 2
      dim_feedforward: 128
    train:
      batch_size: 16
      epochs: 50
      amp: true
      amp_dtype: bf16
