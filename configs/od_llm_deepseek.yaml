inherits: default.yaml

experiment:
  name: od_llm_deepseek_toy

train:
  batch_size: 2
  amp: true
  amp_dtype: bf16

model:
  name: od_llm
  rank: 4
  d_model: 64
  n_heads: 4
  dim_feedforward: 128
  dropout: 0.1
  max_tokens: 4096

  # Recommended for most machines: use a distilled/small local checkpoint.
  # Example local path:
  # pretrained_path: D:/models/DeepSeek-R1-Distill-Qwen-1.5B
  llm_model: deepseek
  pretrained_path: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
  pretrained: true
  local_files_only: true
  trust_remote_code: true
  torch_dtype: bf16

  llm_dim: 1536
  llm_layers: 6
  llm_heads: 12
  freeze_llm: true
  use_reprogramming: true
  num_virtual_prompt_tokens: 8
  num_source_tokens: 1000
