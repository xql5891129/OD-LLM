suite_name: metro_main
base_config: configs/metro/metroflow_top80_base.yaml

experiments:
  - name: ha
    model:
      name: historical_average
    train:
      epochs: 1
      batch_size: 16
      amp: false

  - name: lstm
    model:
      name: lstm_baseline
      d_model: 128
      num_layers: 2
      dim_feedforward: 256
    train:
      batch_size: 4
      epochs: 30
      learning_rate: 0.001
      monitor_metric: mae
      amp: false

  - name: tcn
    model:
      name: tcn_baseline
      d_model: 128
      num_layers: 3
      kernel_size: 3
      dim_feedforward: 256
    train:
      batch_size: 8
      epochs: 30
      learning_rate: 0.001
      monitor_metric: mae
      amp: false

  - name: transformer
    model:
      name: transformer_flatten
      d_model: 128
      n_heads: 4
      num_layers: 2
      dim_feedforward: 256
    train:
      batch_size: 8
      epochs: 30
      learning_rate: 0.001
      monitor_metric: mae
      amp: false

  - name: odmixer
    data:
      prev_lag: 144
    model:
      name: odmixer
      d_model: 16
      hidden_dim: 16
      num_layers: 5
      layer_nums: 5
      dim_feedforward: 64
      dropout: 0.1
      prev_od_mode: lag1
      output_activation: softplus_shift
      auxiliary_loss_weight: 1.0
    train:
      batch_size: 16
      epochs: 80
      learning_rate: 0.001
      weight_decay: 0.0
      patience: 20
      monitor_metric: mae
      amp: true
      amp_dtype: fp16

  - name: odcrn
    model:
      name: odcrn
      d_model: 16
      hidden_dim: 16
      num_layers: 2
      dim_feedforward: 64
      cheby_order: 2
      kernel_type: random_walk_diffusion
      static_graph_mode: batch_od
      use_dynamic_graph: true
      output_activation: softplus
      input_transform: log1p
      inverse_output: true
      log_output_max: 8.0
    train:
      batch_size: 4
      epochs: 40
      learning_rate: 0.0003
      weight_decay: 0.0
      patience: 12
      monitor_metric: mae
      amp: false
      amp_dtype: fp16

  - name: od_llm
    train:
      batch_size: 1
      learning_rate: 0.00012
      llm_learning_rate: 0.000008
      epochs: 50
      patience: 12
      grad_accum_steps: 2
      monitor_metric: rmse
      amp: true
      amp_dtype: fp16
      compute_train_metrics: false
    model:
      name: od_llm
      rank: 16
      d_model: 64
      n_heads: 4
      dim_feedforward: 128
      dropout: 0.1
      max_tokens: 4096
      decoder_mode: residual_last
      decoder_scale: 1.0
      zero_init_decoder: true
      use_pair_trend_head: true
      pair_trend_mode: pair_specific
      pair_trend_scale: 1.0
      zero_init_pair_trend: true
      residual_activation: softplus_shift
      softplus_beta: 10.0
      context_pooling: horizon_attention
      horizon_attention_heads: 12
      llm_model: qwen2.5-1.5b
      pretrained_path: hf_models/qwen2.5-1.5b
      pretrained: true
      local_files_only: true
      trust_remote_code: true
      torch_dtype: fp16
      llm_dim: 1536
      llm_layers: 6
      llm_heads: 12
      freeze_llm: true
      llm_trainable_layers: 1
      llm_trainable_layer_norm: true
      llm_trainable_fp32: true
      llm_gradient_checkpointing: true
      use_reprogramming: true
      use_time_features: true
      num_virtual_prompt_tokens: 8
      num_source_tokens: 1000
    loss:
      alpha: 1.0
      beta: 0.5
      gamma: 0.5
      topk: 20
      nonzero_threshold: 0.0
      mse_weight: 0.05
      nonzero_mse_weight: 0.0
      topk_mse_weight: 0.008
