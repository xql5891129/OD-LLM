inherits: ../common/default.yaml
device: cuda

experiment:
  name: metroflow_top80_base

outputs:
  root: outputs/metroflow_top80

data:
  format: npy
  path: data/metroflow_top80/od.npy
  input_len: 12
  pred_len: 3
  train_ratio: 0.7
  val_ratio: 0.1
  test_ratio: 0.2

train:
  batch_size: 8
  epochs: 30
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 10
  amp: false
  amp_dtype: fp16
  compute_train_metrics: false
  monitor_metric: mae

model:
  name: transformer_flatten
  rank: 4
  d_model: 128
  n_heads: 4
  num_layers: 2
  dim_feedforward: 256
  dropout: 0.1
  max_tokens: 4096

loss:
  alpha: 1.0
  beta: 1.0
  gamma: 1.0
  topk: 20
  nonzero_threshold: 0.0
  mse_weight: 0.0
  nonzero_mse_weight: 0.0
  topk_mse_weight: 0.0
