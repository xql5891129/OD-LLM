suite_name: line_bus_projection_ablation
base_config: configs/line_bus/daxuecheng_60_base.yaml

x_projection_data: &projection_data
  use_poi_features: true
  time_features_mode: core_weather

x_projection_train: &projection_train
  batch_size: 16
  learning_rate: 0.00005
  epochs: 6
  patience: 2
  resume_checkpoint: auto
  init_checkpoint: none
  evaluate_initial_checkpoint: false
  monitor_metric: rmse
  amp: true
  amp_dtype: bf16
  compute_train_metrics: false
  stream_metrics: true
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  allow_tf32: true
  grad_clip: 0.25
  sanitize_nonfinite: true
  skip_nonfinite_batches: true
  max_nonfinite_batches: 20
  prediction_clip: 1000.0

x_projection_model: &projection_model
  name: od_llm
  rank: 10
  d_model: 96
  n_heads: 4
  dim_feedforward: 256
  dropout: 0.1
  max_tokens: 4096
  decoder_mode: residual_seasonal
  decoder_scale: 0.25
  delta_limit: 12.0
  zero_init_decoder: true
  use_pair_trend_head: false
  pair_input_transform: log1p
  use_decoder_pair_gate: false
  use_full_rank_pair_decoder: true
  full_rank_hidden_dim: 64
  full_rank_base_gate_init: 0.8
  full_rank_delta_scale: 1.0
  full_rank_delta_limit: 12.0
  use_marginal_features: true
  use_relative_pair_delta: true
  relative_pair_delta_limit: 1.0
  use_sparse_hurdle_head: true
  occurrence_init: 0.5
  occurrence_prior_scale: 1.0
  occurrence_temperature: 1.0
  use_local_od_mixer: false
  residual_activation: softplus_shift
  softplus_beta: 2.0
  seasonal_blend_init: 0.8
  learnable_seasonal_blend: false
  use_context_base_gate: false
  context_pooling: horizon_attention
  horizon_attention_heads: 12
  llm_model: qwen2.5-1.5b
  pretrained_path: hf_models/qwen2.5-1.5b
  pretrained: true
  local_files_only: true
  trust_remote_code: true
  torch_dtype: bf16
  attn_implementation: sdpa
  llm_dim: 1536
  llm_layers: 4
  llm_heads: 12
  freeze_llm: true
  llm_trainable_layers: 0
  llm_trainable_layer_norm: false
  llm_trainable_fp32: true
  llm_gradient_checkpointing: false
  use_reprogramming: true
  use_time_features: true
  time_features_mode: core_weather
  use_poi_features: true
  dynamic_poi_features: true
  # POI remains available to the pair decoder. Setting this to zero isolates
  # the origin/destination projection method inside the tokenizer.
  poi_projection_scale: 0.0
  token_value_transform: signed_log1p
  num_virtual_prompt_tokens: 8
  num_source_tokens: 512

x_projection_loss: &projection_loss
  use_od_mask: true
  alpha: 1.0
  beta: 0.8
  gamma: 0.6
  topk: 20
  nonzero_threshold: 0.0
  mse_weight: 0.08
  nonzero_mse_weight: 0.0
  topk_mse_weight: 0.012
  occurrence_loss_weight: 0.08
  occurrence_positive_weight: 0.8
  magnitude_loss_weight: 0.04
  magnitude_mse_weight: 0.004

x_projection_metrics: &projection_metrics
  report_keys: [mae, rmse, wape]

experiments:
  - name: projection_svd_fixed
    data: *projection_data
    train: *projection_train
    model:
      <<: *projection_model
      projection_mode: svd_fixed
      projection_path: data/processed_line_bus/daxuecheng/60min/projections/two_sided_svd_rank10.pt
    loss: *projection_loss
    metrics: *projection_metrics

  - name: projection_svd_trainable
    data: *projection_data
    train: *projection_train
    model:
      <<: *projection_model
      projection_mode: svd_trainable
      projection_path: data/processed_line_bus/daxuecheng/60min/projections/two_sided_svd_rank10.pt
    loss: *projection_loss
    metrics: *projection_metrics

  - name: projection_learnable
    data: *projection_data
    train: *projection_train
    model:
      <<: *projection_model
      projection_mode: learnable
    loss: *projection_loss
    metrics: *projection_metrics
