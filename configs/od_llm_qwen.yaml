inherits: default.yaml

experiment:
  name: od_llm_qwen_toy

model:
  name: od_llm
  rank: 4
  d_model: 64
  n_heads: 4
  dim_feedforward: 128
  dropout: 0.1
  max_tokens: 4096

  # Use a local path for reproducible migration, e.g.
  # pretrained_path: D:/models/Qwen2.5-1.5B
  # or a HuggingFace model id if you allow downloads with uv/transformers.
  llm_model: qwen
  pretrained_path: Qwen/Qwen2.5-1.5B
  pretrained: true
  local_files_only: true
  trust_remote_code: true

  # These are used for adapter shapes before the HF model is loaded.
  # The real hidden size is inferred from the loaded config.
  llm_dim: 1536
  llm_layers: 6
  llm_heads: 12
  freeze_llm: true
  use_reprogramming: true
  num_virtual_prompt_tokens: 8

