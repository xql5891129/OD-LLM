seed: 42
device: auto

experiment:
  name: od_tensor_transformer_toy

data:
  format: npy
  path: data/toy/od.npy
  input_len: 12
  pred_len: 3
  train_ratio: 0.7
  val_ratio: 0.1
  test_ratio: 0.2
  transform: none
  csv:
    time_col: time
    origin_col: origin
    destination_col: destination
    flow_col: flow

train:
  batch_size: 8
  num_workers: 0
  shuffle_train: true
  epochs: 5
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip: 5.0
  patience: 5

model:
  name: od_tensor_transformer
  rank: 4
  d_model: 64
  n_heads: 4
  num_layers: 2
  dim_feedforward: 128
  dropout: 0.1
  max_tokens: 4096

loss:
  alpha: 1.0
  beta: 1.0
  gamma: 1.0
  topk: 20
  nonzero_threshold: 0.0

metrics:
  topk: 20
  high_flow_quantile: 0.9
  zero_threshold: 0.0
  pred_positive_threshold: 0.5

outputs:
  root: outputs
  use_run_subdir: true
  checkpoints: outputs/checkpoints
  logs: outputs/logs
  figures: outputs/figures
  explanations: outputs/explanations
