inherits: default.yaml

experiment:
  name: od_tensor_transformer_real

data:
  format: npy
  path: data/real/od.npy
  input_len: 12
  pred_len: 3
  train_ratio: 0.7
  val_ratio: 0.1
  test_ratio: 0.2

train:
  batch_size: 16
  epochs: 50
  learning_rate: 0.001
  patience: 10
  compute_train_metrics: false

model:
  name: od_tensor_transformer
  rank: 4
  d_model: 64
  n_heads: 4
  num_layers: 2
  dim_feedforward: 128
  dropout: 0.1
