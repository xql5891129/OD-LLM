[project]
name = "od-llm"
version = "0.1.0"
description = "OD-LLM: bus OD demand forecasting and explanation with LLM backbones"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "torch>=2.3",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "transformers>=4.44",
    "accelerate>=0.33",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
explain = [
    "seaborn>=0.13",
]
download = [
    "huggingface-hub>=0.24",
    "modelscope>=1.19",
]
data = [
    "pyarrow>=16.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"
